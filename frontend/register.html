<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · TaskProgress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="auth">
    <aside class="auth-side">
      <a class="brand" href="index.html">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--border)" stroke-width="3.5"/><circle cx="13" cy="13" r="10" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="46 63" transform="rotate(-90 13 13)"/></svg>
        <span>TaskProgress</span>
      </a>
      <div class="auth-copy">
        <h1>Plan the day. Check it off. Watch the percentage climb.</h1>
        <span class="formula">completed ÷ total × 100</span>
      </div>
      <p class="muted small">Daily, monthly and yearly progress, calculated from your own tasks.</p>
    </aside>
    <main class="auth-main">
      <button type="button" class="icon-btn auth-theme" data-theme-toggle aria-label="Switch theme">
        <span class="icon-moon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
        <span class="icon-sun"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      </button>
      <form class="auth-form" id="authForm" data-mode="register" novalidate>
        <div><h2 style="font-size:1.6rem;letter-spacing:-0.02em">Create your account</h2><p class="muted" style="margin-top:4px">Start tracking your progress today.</p></div>
        <p class="form-error" id="formError" role="alert" hidden></p>
        <label class="field"><span>Name</span><input type="text" name="name" autocomplete="name" maxlength="50" required></label>
        <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small class="muted">At least 8 characters.</small></label>
        <button class="btn primary block" type="submit" id="submitBtn">Create account</button>
        <p class="muted center">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </main>
  </div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
