<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics · TaskProgress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content">
      <header class="mobile-top" id="mobileTop"></header>
      <main class="main" id="main">
        <div class="page-head">
          <h1>Analytics</h1>
          <div class="tabs" role="tablist" aria-label="Analytics period">
            <button type="button" role="tab" data-view="month" aria-selected="true">Monthly</button>
            <button type="button" role="tab" data-view="year" aria-selected="false">Yearly</button>
          </div>
        </div>

        <div class="period-nav">
          <button type="button" class="icon-btn outlined" id="prevPeriod" aria-label="Previous period"></button>
          <select id="monthSelect" aria-label="Month"></select>
          <select id="yearSelect" aria-label="Year"></select>
          <button type="button" class="icon-btn outlined" id="nextPeriod" aria-label="Next period"></button>
        </div>

        <div id="analyticsBody" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
